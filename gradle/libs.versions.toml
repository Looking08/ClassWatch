[versions]
agp = "8.7.3"
kotlin = "2.0.21"

# Compose 物料清单（BOM）。它一次性锁定 ui / foundation / material 的兼容版本。
# 如果 Gradle Sync 报错提示版本不匹配，只改这一个版本号即可。
composeBom = "2024.10.01"

# Wear OS 专用 Compose 库
wearCompose = "1.4.0"
wearTiles = "1.4.0"

# 手机端 Material3
material3 = "1.3.0"
activityCompose = "1.9.2"
lifecycleRuntime = "2.8.6"
coreSplashscreen = "1.0.1"

gson = "2.11.0"

compileSdk = "35"
minSdkWear = "30"
minSdkPhone = "26"
targetSdk = "35"
javaVersion = "17"

[libraries]
# ---------- Compose / UI ----------
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# ---------- Activity / Lifecycle ----------
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# ---------- Wear OS ----------
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-tiles-material = { group = "androidx.wear.tiles", name = "tiles-material", version.ref = "wearTiles" }
wear-tiles-tooling = { group = "androidx.wear.tiles", name = "tiles-tooling", version.ref = "wearTiles" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview" }

# ---------- 数据 ----------
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
